name: Reusable child
on:
  workflow_call:
    outputs:
      gate_result:
        value: ${{ jobs.gate.outputs.result }}
jobs:
  advisory:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
  gate:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.check.outcome }}
    steps:
      - id: check
        run: exit 0
